name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The heavy extras (torch via sentence-transformers, streamlit) are not
      # installed in CI. The offline "hashing" embedding backend and the
      # "identity" reranker exercise the same code paths in seconds, which is
      # the point of having them.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval,dev]" fastapi uvicorn faiss-cpu

      - name: Tests
        run: pytest -q

      - name: Offline end-to-end evaluation
        run: semsearch eval --config configs/experiment.offline.yaml

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: results/
