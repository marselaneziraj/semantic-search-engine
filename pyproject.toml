[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-search-engine"
version = "0.1.0"
description = "BM25 vs dense vs hybrid vs reranked retrieval, with a proper IR evaluation harness."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Marsela Neziraj" }]
keywords = ["information-retrieval", "bm25", "dense-retrieval", "faiss", "beir", "ndcg"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rank-bm25>=0.2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]
eval = [
    "ir_measures>=0.3.3",
    "ir_datasets>=0.5.5",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.33",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
semsearch = "semsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
